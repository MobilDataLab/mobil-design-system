<!-- @dsCard group="Slides" viewport="1280x720" name="Section divider" subtitle="Dark ground, big index number, key-word-in-blue title (motif 5)" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .slide { width: 1280px; height: 720px; background: var(--ink); color: #fff; position: relative; overflow: hidden; font-family: var(--font-body); }
  .num { position: absolute; top: 56px; left: 64px; font-family: var(--font-heading); font-weight: 400; font-size: 200px; line-height: 0.8; color: var(--blue); opacity: 0.9; }
  .body { position: absolute; left: 64px; bottom: 150px; }
  .eyebrow { font-family: var(--font-heading); text-transform: uppercase; font-size: 16px; letter-spacing: 0.2em; color: var(--gray-400); margin-bottom: 14px; }
  .title { font-family: var(--font-heading); text-transform: uppercase; font-weight: 400; font-size: 84px; line-height: 1.0; letter-spacing: 0.01em; margin: 0; }
  .title .hl { color: var(--blue-light); }
  .rule { position: absolute; left: 64px; right: 64px; bottom: 64px; height: 1px; background: rgba(255,255,255,0.18); }
  .foot { position: absolute; left: 64px; bottom: 40px; font-family: var(--font-body); font-size: 13px; color: var(--gray-400); letter-spacing: 0.04em; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: var(--blue); }
</style>
</head>
<body>
  <div class="slide">
    <div class="num">02</div>
    <div class="body">
      <div class="eyebrow">Capítulo</div>
      <h2 class="title">Carga por <span class="hl">taller</span></h2>
    </div>
    <div class="rule"></div>
    <div class="foot">Mobil Arquitectos · Saturación 2026</div>
    <div class="bar"></div>
  </div>
</body>
</html>
