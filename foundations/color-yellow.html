<!-- @dsCard group="0 · Transversal — Color" viewport="700x150" name="Yellow accent" subtitle="Single accent — callouts & key ideas only. Text on yellow is always ink." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--white); display: flex; }
  .sw { width: 240px; height: 150px; background: var(--yellow); display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; box-sizing: border-box; color: var(--ink); }
  .name { font-family: var(--font-heading); font-weight: 700; text-transform: uppercase; font-size: 15px; }
  .hex { font-size: 11px; margin-top: 2px; }
  .note { flex: 1; padding: 16px 20px; box-sizing: border-box; }
  .callout { background: var(--yellow); color: var(--ink); padding: 10px 14px; font-family: var(--font-heading); font-weight: 700; text-transform: uppercase; font-size: 18px; display: inline-block; }
  .rule { font-size: 12px; color: var(--gray-700); margin-top: 14px; line-height: 1.5; }
  .rule b { color: var(--ink); }
</style>
</head>
<body>
  <div class="sw"><span class="name">Yellow</span><span class="hex">#FFF81D · Pantone 3945 C</span></div>
  <div class="note">
    <span class="callout">Idea clave</span>
    <p class="rule">Use for <b>callouts, highlights, key ideas only</b>. Never as a surface for body text. Text on yellow is <b>always ink (#1A1A1A)</b> — never white.</p>
  </div>
</body>
</html>
