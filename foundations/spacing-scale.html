<!-- @dsCard group="0 · Transversal — Espaciado y forma" viewport="700x150" name="Spacing scale" subtitle="4px base — 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--white); padding: 20px 24px; box-sizing: border-box; }
  .row { display: flex; align-items: flex-end; gap: 18px; height: 96px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--blue); width: 100%; }
  .lab { font-size: 10px; color: var(--gray-700); font-family: var(--font-body); white-space: nowrap; }
  .lab b { color: var(--ink); display: block; font-size: 11px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><span class="bar" style="height:4px;width:4px"></span><span class="lab"><b>4</b>space-1</span></div>
    <div class="item"><span class="bar" style="height:8px;width:8px"></span><span class="lab"><b>8</b>space-2</span></div>
    <div class="item"><span class="bar" style="height:12px;width:12px"></span><span class="lab"><b>12</b>space-3</span></div>
    <div class="item"><span class="bar" style="height:16px;width:16px"></span><span class="lab"><b>16</b>space-4</span></div>
    <div class="item"><span class="bar" style="height:24px;width:24px"></span><span class="lab"><b>24</b>space-6</span></div>
    <div class="item"><span class="bar" style="height:32px;width:32px"></span><span class="lab"><b>32</b>space-8</span></div>
    <div class="item"><span class="bar" style="height:48px;width:48px"></span><span class="lab"><b>48</b>space-12</span></div>
    <div class="item"><span class="bar" style="height:64px;width:64px"></span><span class="lab"><b>64</b>space-16</span></div>
  </div>
</body>
</html>
