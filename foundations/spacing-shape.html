<!-- @dsCard group="0 · Transversal — Espaciado y forma" viewport="700x180" name="Shape — rules & zero radius" subtitle="Thin 1px / thick 4px rules. border-radius: 0 everywhere." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--white); padding: 22px 24px; box-sizing: border-box; display: flex; gap: 36px; align-items: center; }
  .blk { display: flex; flex-direction: column; gap: 10px; }
  .lab { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gray-400); }
  .lab b { color: var(--ink); }
  .thin { width: 200px; border-top: 1px solid var(--ink); }
  .thick { width: 200px; border-top: 4px solid var(--blue); }
  .box { width: 90px; height: 90px; background: var(--blue); border-radius: 0; }
  .box-row { display: flex; gap: 14px; align-items: center; }
  .x { font-family: var(--font-heading); font-weight: 900; font-size: 30px; color: var(--gray-400); }
</style>
</head>
<body>
  <div class="blk">
    <div><div class="thin"></div><div class="lab" style="margin-top:6px"><b>1px</b> · rule-thin</div></div>
    <div><div class="thick"></div><div class="lab" style="margin-top:6px"><b>4px</b> · rule-thick (brand bar)</div></div>
  </div>
  <div class="box-row">
    <div class="box"></div>
    <span class="x">↳</span>
    <div class="lab" style="max-width:150px;line-height:1.6"><b>radius: 0</b><br>Sharp corners everywhere. No rounding, no shadows, no gradients. Flat surfaces only.</div>
  </div>
</body>
</html>
