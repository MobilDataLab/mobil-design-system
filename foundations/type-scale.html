<!-- @dsCard group="0 · Transversal — Tipografía" viewport="700x320" name="Type scale — modular 1.25" subtitle="Display → caption. Condensed headings, Roboto body." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--white); padding: 20px 24px; box-sizing: border-box; }
  .ladder { display: flex; flex-direction: column; gap: 8px; }
  .step { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--gray-200); padding-bottom: 6px; }
  .tok { width: 110px; flex-shrink: 0; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gray-400); }
  .tok b { display: block; color: var(--gray-700); font-size: 11px; letter-spacing: 0; text-transform: none; margin-top: 1px; }
  .spec { font-family: var(--font-heading); text-transform: uppercase; color: var(--ink); line-height: 1.05; white-space: nowrap; }
</style>
</head>
<body>
  <div class="ladder">
    <div class="step"><span class="tok">Display<b>76 / Light</b></span><span class="spec" style="font-size:50px;font-weight:300">Mobil</span></div>
    <div class="step"><span class="tok">H1<b>61 / Light</b></span><span class="spec" style="font-size:42px;font-weight:300">Arquitectura</span></div>
    <div class="step"><span class="tok">H2<b>49 / Regular</b></span><span class="spec" style="font-size:34px;font-weight:400">Hospitales y metro</span></div>
    <div class="step"><span class="tok">H3<b>39 / Regular</b></span><span class="spec" style="font-size:27px;font-weight:400">Diseño urbano</span></div>
    <div class="step"><span class="tok">H4<b>31 / Regular</b></span><span class="spec" style="font-size:22px;font-weight:400">Vivienda social</span></div>
    <div class="step"><span class="tok">H6<b>20 / Regular</b></span><span class="spec" style="font-size:16px;font-weight:400;letter-spacing:0.04em">Columna · título</span></div>
  </div>
</body>
</html>
