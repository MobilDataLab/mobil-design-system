<!-- @dsCard group="0 · Transversal — Color" viewport="700x150" name="Semantic states" subtitle="Error / success / warning — functional only, never brand expression" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--white); padding: 18px 20px; box-sizing: border-box; }
  .lead { font-size: 12px; color: var(--gray-700); margin: 0 0 14px; }
  .lead b { color: var(--ink); }
  .row { display: flex; gap: 14px; }
  .sw { display: flex; align-items: center; gap: 10px; }
  .chip { width: 40px; height: 40px; flex-shrink: 0; }
  .name { font-family: var(--font-heading); font-weight: 700; text-transform: uppercase; font-size: 13px; }
  .hex { font-size: 11px; color: var(--gray-700); }
</style>
</head>
<body>
  <p class="lead">Reserved for <b>UI state feedback only</b> (error / success / warning). These are not part of brand expression — no red, orange or green as brand color.</p>
  <div class="row">
    <div class="sw"><span class="chip" style="background:var(--state-error)"></span><div><div class="name">Error</div><div class="hex">#C8412C</div></div></div>
    <div class="sw"><span class="chip" style="background:var(--state-success)"></span><div><div class="name">Success</div><div class="hex">#1F8A5B</div></div></div>
    <div class="sw"><span class="chip" style="background:var(--state-warning)"></span><div><div class="name">Warning</div><div class="hex">#C28D1F</div></div></div>
  </div>
</body>
</html>
