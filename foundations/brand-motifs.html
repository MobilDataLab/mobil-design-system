<!-- @dsCard group="Brand" viewport="700x260" name="Brand motifs" subtitle="Blue bar · vertical margin text · key-word-in-blue · yellow callout" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--white); padding: 0; }
  .stage { display: grid; grid-template-columns: 1fr 1fr; }
  .panel { position: relative; height: 260px; box-sizing: border-box; padding: 24px 24px 24px 40px; border-right: 1px solid var(--gray-200); overflow: hidden; }
  .vmargin { position: absolute; left: 8px; top: 50%; transform: translateY(-50%) rotate(180deg); writing-mode: vertical-rl; font-family: var(--font-heading); text-transform: uppercase; font-size: 10px; letter-spacing: 0.35em; color: var(--gray-400); }
  .title { font-family: var(--font-heading); text-transform: uppercase; font-weight: 700; font-size: 40px; line-height: 1.05; color: var(--ink); margin: 0; }
  .title .hl { color: var(--blue); }
  .blue-bar { height: 4px; background: var(--blue); width: 100%; position: absolute; bottom: 0; left: 0; }
  .callout { background: var(--yellow); color: var(--ink); padding: 14px 16px; font-family: var(--font-heading); text-transform: uppercase; font-weight: 700; font-size: 22px; line-height: 1.1; }
  .lead { font-family: var(--font-body); font-size: 13px; color: var(--gray-700); margin: 14px 0 0; line-height: 1.5; }
</style>
</head>
<body>
  <div class="stage">
    <div class="panel">
      <span class="vmargin">Mobil Arquitectos</span>
      <h2 class="title">Somos <span class="hl">Mobil</span></h2>
      <p class="lead">Vertical letterspaced text in the left margin; a key word set in blue inside an ink title.</p>
      <div class="blue-bar"></div>
    </div>
    <div class="panel" style="border-right:none">
      <div class="callout">Saturación crítica<br>en TV / TC</div>
      <p class="lead">Yellow callout blocks isolate a single key insight. Closed by the 4px blue bar that anchors the foot of every section.</p>
      <div class="blue-bar"></div>
    </div>
  </div>
</body>
</html>
