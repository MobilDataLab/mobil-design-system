<!-- @dsCard group="0 · Transversal — Color" viewport="700x150" name="Blue — single lineage" subtitle="One canonical brand blue (#006BFF) and its tints/shades" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--white); }
  .row { display: flex; }
  .sw { flex: 1; height: 150px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-sizing: border-box; }
  .name { font-family: var(--font-heading); font-weight: 700; text-transform: uppercase; font-size: 13px; letter-spacing: 0.02em; }
  .hex { font-family: var(--font-body); font-size: 11px; opacity: 0.85; margin-top: 2px; }
  .canon { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; font-family: var(--font-body); font-weight: 700; margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--blue-tint);  color:var(--ink);"><span class="name">Tint</span><span class="hex">#E7F3FD</span></div>
    <div class="sw" style="background:var(--blue-light); color:#fff;"><span class="name">Light</span><span class="hex">#479AFF</span></div>
    <div class="sw" style="background:var(--blue);       color:#fff;"><span class="canon">◆ Canonical</span><span class="name">Blue</span><span class="hex">#006BFF</span></div>
    <div class="sw" style="background:var(--blue-strong);color:#fff;"><span class="name">Strong</span><span class="hex">#0256CA</span></div>
    <div class="sw" style="background:var(--blue-deep);  color:#fff;"><span class="name">Deep</span><span class="hex">#011D41</span></div>
  </div>
</body>
</html>
