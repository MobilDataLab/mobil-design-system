<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--white); padding: 22px 24px; box-sizing: border-box; }
  .group { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 18px; }
  .group:last-child { margin-bottom: 0; }
  .ico { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button, IconButton, Input, Select, Checkbox, Radio, Switch } = window.MobilArquitectosDesignSystem_8d3ff0;
    const Plus = () => <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const Down = () => <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M12 4 V16"/><path d="M7 11 L12 16 L17 11"/><path d="M4 16 V20 H20 V16"/></svg>;
    function Demo() {
      return (
        <div>
          <div className="group">
            <Button variant="primary">Guardar</Button>
            <Button variant="secondary">Cancelar</Button>
            <Button variant="ghost">Ver más</Button>
            <Button variant="danger">Eliminar</Button>
            <Button variant="primary" size="sm">Subir Excel</Button>
            <Button variant="primary" disabled>Bloqueado</Button>
            <div className="ico">
              <IconButton variant="outline" label="Agregar"><Plus/></IconButton>
              <IconButton variant="solid" label="Descargar"><Down/></IconButton>
              <IconButton variant="ghost" label="Agregar"><Plus/></IconButton>
            </div>
          </div>
          <div className="group">
            <Input label="Proyecto" placeholder="Hospital Sótero del Río" style={{width:220}} />
            <Select label="Taller" options={["TV — Vivienda","TC — Comercial","TI — Infraestructura","TS — Salud","TU — Urbano"]} style={{width:200}} />
            <Input label="Código" defaultValue="MOB-1042" style={{width:120}} />
          </div>
          <div className="group">
            <Checkbox label="Solo proyectos activos" defaultChecked />
            <Radio label="Ocupación" name="m" defaultChecked />
            <Radio label="Saturación" name="m" />
            <Switch label="Mostrar finalizados" defaultChecked />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
  </script>
</body>
</html>
