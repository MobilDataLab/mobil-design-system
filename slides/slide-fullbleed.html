<!-- @dsCard group="Slides" viewport="1280x720" name="Full-bleed image" subtitle="Photography with white uppercase title overlaid, left-aligned (motif 3)" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .slide { width: 1280px; height: 720px; position: relative; overflow: hidden; font-family: var(--font-body); }
  /* Image placeholder — replace with a real full-bleed project photo */
  .photo { position: absolute; inset: 0; background: repeating-linear-gradient(135deg, #0a2c5c, #0a2c5c 28px, #0d3367 28px, #0d3367 56px); display: grid; place-items: center; }
  .photo .ph { font-family: var(--font-heading); text-transform: uppercase; font-size: 15px; letter-spacing: 0.2em; color: rgba(255,255,255,0.45); border: 1px dashed rgba(255,255,255,0.4); padding: 12px 22px; }
  .scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(1,29,65,0.78) 0%, rgba(1,29,65,0.35) 48%, rgba(1,29,65,0) 72%); }
  .body { position: absolute; left: 64px; bottom: 110px; color: #fff; max-width: 760px; }
  .eyebrow { font-family: var(--font-heading); text-transform: uppercase; font-size: 16px; letter-spacing: 0.2em; color: var(--yellow); margin-bottom: 16px; }
  .title { font-family: var(--font-heading); text-transform: uppercase; font-weight: 300; font-size: 88px; line-height: 0.98; letter-spacing: 0.01em; margin: 0; }
  .sub { font-family: var(--font-body); font-size: 19px; line-height: 1.5; margin-top: 18px; color: rgba(255,255,255,0.92); max-width: 560px; }
  .foot { position: absolute; left: 64px; bottom: 44px; font-family: var(--font-body); font-size: 13px; color: rgba(255,255,255,0.7); letter-spacing: 0.04em; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: var(--blue); }
</style>
</head>
<body>
  <div class="slide">
    <div class="photo"><span class="ph">Foto de proyecto · full-bleed</span></div>
    <div class="scrim"></div>
    <div class="body">
      <div class="eyebrow">Caso de estudio</div>
      <h2 class="title">Hospital<br>Sótero del Río</h2>
      <p class="sub">Infraestructura hospitalaria de alta complejidad. Taller de Salud (TS).</p>
    </div>
    <div class="foot">Mobil Arquitectos · 2026</div>
    <div class="bar"></div>
  </div>
</body>
</html>
