<!-- @dsCard group="Brand" viewport="700x180" name="Hexagon mark" subtitle="Pointy-top hexagon, 6 radials. Four approved colorways." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--white); display: flex; }
  .cell { flex: 1; height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .cell svg { width: 56px; height: 64px; }
  .lab { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gray-400); }
  .b1 { background: var(--white); } .b1 .lab { color: var(--gray-700); }
  .b2 { background: var(--blue); } .b2 .lab { color: rgba(255,255,255,0.8); }
  .b3 { background: var(--ink); } .b3 .lab { color: var(--gray-400); }
  .b4 { background: var(--white); border-left: 1px solid var(--gray-200); } .b4 .lab { color: var(--gray-700); }
</style>
</head>
<body>
  <div class="cell b1">
    <svg viewBox="0 0 840 960"><g fill="none" stroke="#006BFF" stroke-width="24" stroke-linecap="square"><line x1="420" y1="30" x2="809.71" y2="255"/><line x1="809.71" y1="255" x2="809.71" y2="705"/><line x1="809.71" y1="705" x2="420" y2="930"/><line x1="420" y1="930" x2="30.29" y2="705"/><line x1="30.29" y1="705" x2="30.29" y2="255"/><line x1="30.29" y1="255" x2="420" y2="30"/><line x1="420" y1="480" x2="420" y2="30"/><line x1="420" y1="480" x2="809.71" y2="255"/><line x1="420" y1="480" x2="809.71" y2="705"/><line x1="420" y1="480" x2="420" y2="930"/><line x1="420" y1="480" x2="30.29" y2="705"/><line x1="420" y1="480" x2="30.29" y2="255"/></g></svg>
    <span class="lab">Blue / white</span>
  </div>
  <div class="cell b2">
    <svg viewBox="0 0 840 960"><g fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="square"><line x1="420" y1="30" x2="809.71" y2="255"/><line x1="809.71" y1="255" x2="809.71" y2="705"/><line x1="809.71" y1="705" x2="420" y2="930"/><line x1="420" y1="930" x2="30.29" y2="705"/><line x1="30.29" y1="705" x2="30.29" y2="255"/><line x1="30.29" y1="255" x2="420" y2="30"/><line x1="420" y1="480" x2="420" y2="30"/><line x1="420" y1="480" x2="809.71" y2="255"/><line x1="420" y1="480" x2="809.71" y2="705"/><line x1="420" y1="480" x2="420" y2="930"/><line x1="420" y1="480" x2="30.29" y2="705"/><line x1="420" y1="480" x2="30.29" y2="255"/></g></svg>
    <span class="lab">White / blue</span>
  </div>
  <div class="cell b3">
    <svg viewBox="0 0 840 960"><g fill="none" stroke="#006BFF" stroke-width="24" stroke-linecap="square"><line x1="420" y1="30" x2="809.71" y2="255"/><line x1="809.71" y1="255" x2="809.71" y2="705"/><line x1="809.71" y1="705" x2="420" y2="930"/><line x1="420" y1="930" x2="30.29" y2="705"/><line x1="30.29" y1="705" x2="30.29" y2="255"/><line x1="30.29" y1="255" x2="420" y2="30"/><line x1="420" y1="480" x2="420" y2="30"/><line x1="420" y1="480" x2="809.71" y2="255"/><line x1="420" y1="480" x2="809.71" y2="705"/><line x1="420" y1="480" x2="420" y2="930"/><line x1="420" y1="480" x2="30.29" y2="705"/><line x1="420" y1="480" x2="30.29" y2="255"/></g></svg>
    <span class="lab">Blue / dark</span>
  </div>
  <div class="cell b4">
    <svg viewBox="0 0 840 960"><g fill="none" stroke="#1A1A1A" stroke-width="24" stroke-linecap="square"><line x1="420" y1="30" x2="809.71" y2="255"/><line x1="809.71" y1="255" x2="809.71" y2="705"/><line x1="809.71" y1="705" x2="420" y2="930"/><line x1="420" y1="930" x2="30.29" y2="705"/><line x1="30.29" y1="705" x2="30.29" y2="255"/><line x1="30.29" y1="255" x2="420" y2="30"/><line x1="420" y1="480" x2="420" y2="30"/><line x1="420" y1="480" x2="809.71" y2="255"/><line x1="420" y1="480" x2="809.71" y2="705"/><line x1="420" y1="480" x2="420" y2="930"/><line x1="420" y1="480" x2="30.29" y2="705"/><line x1="420" y1="480" x2="30.29" y2="255"/></g></svg>
    <span class="lab">Ink mono</span>
  </div>
</body>
</html>
