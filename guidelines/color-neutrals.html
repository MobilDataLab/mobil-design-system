<!-- @dsCard group="Colors" viewport="700x150" name="Cold neutrals" subtitle="Five cold-gray steps + absolutes. No warm grays, no beige, no taupe." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--white); }
  .row { display: flex; }
  .sw { flex: 1; height: 150px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-sizing: border-box; }
  .sw.bordered { border: 1px solid var(--gray-200); }
  .name { font-family: var(--font-heading); font-weight: 700; text-transform: uppercase; font-size: 12px; }
  .hex { font-size: 10.5px; opacity: 0.85; margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--ink);     color:#fff;"><span class="name">Ink</span><span class="hex">#1A1A1A</span></div>
    <div class="sw" style="background:var(--gray-700);color:#fff;"><span class="name">Gray 700</span><span class="hex">#555555</span></div>
    <div class="sw" style="background:var(--gray-400);color:#fff;"><span class="name">Gray 400</span><span class="hex">#A3A3A3</span></div>
    <div class="sw" style="background:var(--gray-200);color:var(--ink);"><span class="name">Gray 200</span><span class="hex">#DEDEDE</span></div>
    <div class="sw" style="background:var(--gray-50); color:var(--ink);"><span class="name">Gray 50</span><span class="hex">#F5F5F5</span></div>
    <div class="sw bordered" style="background:var(--white);color:var(--ink);"><span class="name">White</span><span class="hex">#FFFFFF</span></div>
  </div>
</body>
</html>
